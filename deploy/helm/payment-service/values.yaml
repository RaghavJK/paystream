replicaCount: 2

image:
  repository: paystream/payment-service
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 8081

env:
  KAFKA_BOOTSTRAP: kafka:9092
  DB_URL: jdbc:postgresql://postgres:5432/paystream
  DB_USER: paystream
  # TODO: move the password to a Kubernetes Secret. Never keep real credentials in values.yaml.
  DB_PASSWORD: paystream

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi
