# Local infrastructure only. The three services and the web app run on your machine
# (mvn spring-boot:run / npm run dev) so you can debug them in the IDE.
# TODO (roadmap step 10): add the services here, built from the Dockerfile.
services:
  kafka:
    image: apache/kafka:3.9.0   # single node, KRaft mode, no ZooKeeper; advertises localhost:9092
    ports:
      - "9092:9092"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: paystream
      POSTGRES_USER: paystream
      POSTGRES_PASSWORD: paystream
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
